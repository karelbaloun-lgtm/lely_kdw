<style id="splash-css">
/* Lade-Animation (Liquid Glass, Vektor): erscheint erst, wenn das Laden länger als ~0,25 s dauert, und verschwindet, sobald die Seite fertig ist */
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;
  background:#eceff3;opacity:0;animation:sp-in .35s ease .25s forwards;transition:opacity .4s ease, visibility .4s;}
:root[data-theme="dark"] #splash{background:#0b0d11;}
@media (prefers-color-scheme: dark){ :root[data-theme="auto"] #splash{background:#0b0d11;} }
#splash.sp-done{opacity:0 !important;visibility:hidden;animation:none;}
@keyframes sp-in{to{opacity:1}}
#splash .sp-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;will-change:transform;}
#splash .sp-o1{width:340px;height:340px;left:-80px;top:-60px;background:radial-gradient(circle,rgba(200,16,46,.30),transparent 70%);animation:sp-float1 7s ease-in-out infinite alternate;}
#splash .sp-o2{width:380px;height:380px;right:-120px;bottom:-80px;background:radial-gradient(circle,rgba(70,110,220,.24),transparent 70%);animation:sp-float2 8s ease-in-out infinite alternate;}
@keyframes sp-float1{to{transform:translate(70px,50px) scale(1.15)}}
@keyframes sp-float2{to{transform:translate(-60px,-40px) scale(1.1)}}
#splash .sp-card{position:relative;width:132px;height:132px;border-radius:34px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 50px rgba(15,23,42,.14), inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);animation:sp-bob 2.6s ease-in-out infinite alternate;}
:root[data-theme="dark"] #splash .sp-card{background:rgba(30,33,41,.55);border-color:rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);}
@media (prefers-color-scheme: dark){ :root[data-theme="auto"] #splash .sp-card{background:rgba(30,33,41,.55);border-color:rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);} }
@keyframes sp-bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
#splash .sp-logo{width:92px;height:auto;overflow:visible;}
#splash .sp-box{fill:#C8102E;transform-origin:110px 70px;animation:sp-pop .7s cubic-bezier(.2,.9,.3,1.2) both;}
#splash .sp-ring{fill:none;stroke:#fff;stroke-width:6.5;stroke-dasharray:540;stroke-dashoffset:540;animation:sp-draw 1.4s ease-in-out .15s infinite alternate;}
#splash .sp-word{fill:#fff;font-family:Arial,sans-serif;font-weight:900;font-size:50px;letter-spacing:-2px;text-anchor:middle;opacity:0;animation:sp-fade .6s ease .35s forwards;}
@keyframes sp-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-fade{to{opacity:1}}
#splash .sp-kitt{display:flex;gap:4px;align-items:center;}
#splash .sp-kitt i{position:relative;display:block;width:10px;height:8px;border-radius:3px;background:rgba(200,16,46,.18);}
#splash .sp-kitt i::before,#splash .sp-kitt i::after{content:"";position:absolute;inset:0;border-radius:3px;background:#ff2f4a;box-shadow:0 0 9px 2px rgba(255,47,74,.75);opacity:0;animation:sp-kitt 1.6s linear infinite;}
#splash .sp-kitt i::before{animation-delay:calc(var(--i) * .08s);}
#splash .sp-kitt i::after{animation-delay:calc(.8s + (10 - var(--i)) * .08s);}
@keyframes sp-kitt{0%{opacity:1}8%{opacity:.7}20%{opacity:.25}32%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  #splash .sp-orb,#splash .sp-card,#splash .sp-box,#splash .sp-kitt i::before,#splash .sp-kitt i::after{animation:none !important;}
  #splash .sp-kitt i:nth-child(6)::before{opacity:.85;}
  #splash .sp-ring{animation:none;stroke-dashoffset:0;} #splash .sp-word{animation:none;opacity:1;}
}
@media print{#splash{display:none !important}}

<script id="splash-js">
(function(){
  var t0 = Date.now(), demo = /[?&]splash(=1|&|$)/.test(location.search), done = false;
  function hide(){
    if (done) return; done = true;
    var el = document.getElementById('splash'); if (!el) return;
    var shown = Date.now() - t0 > 250;                  // war sie schon sichtbar? dann kurz stehen lassen, damit es nicht blitzt
    var wait = shown ? Math.max(0, 900 - (Date.now() - t0)) : 0;
    if (demo) wait = Math.max(wait, 3500 - (Date.now() - t0));   // ?splash=1 zeigt die Animation zum Ansehen
    setTimeout(function(){ el.classList.add('sp-done'); setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 500); }, wait);
  }
  function ready(){ requestAnimationFrame(function(){ requestAnimationFrame(hide); }); setTimeout(hide, 120); }   // setTimeout: auch wenn der Tab im Hintergrund lädt
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready); else ready();
  setTimeout(hide, 12000);                                // Sicherheitsnetz
})();
</script>

  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px;}
  .topbar-menu{flex:0 0 auto;color:#fff;text-decoration:none;font-size:.78rem;font-weight:700;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:7px 11px;background:rgba(255,255,255,.12);}
  header.topbar{background:linear-gradient(135deg,var(--lely-red),var(--lely-red-dark));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);position:sticky;top:0;z-index:50;}
  .topbar-row1{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px 12px;}
  .topbar-left{flex:1 1 auto;min-width:0;}
  .topbar-title{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1;}
  .topbar-sub{margin:4px 0 0;font-size:.72rem;font-family:'Consolas',monospace;letter-spacing:.04em;color:rgba(255,255,255,.85);}
  .wrap{max-width:1100px;margin:0 auto;padding:0 12px;}
  .hidden{display:none !important;}
  button{font-family:inherit;}

  /* start screen */
  .start{margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 20px;text-align:center;}
  .start h2{margin:0 0 6px;font-size:1.15rem;}
  .start p{margin:0 0 16px;color:var(--muted);font-size:.9rem;line-height:1.45;}
  .drop{border:2px dashed var(--border);border-radius:12px;padding:20px 12px;margin-bottom:12px;}
  .drop.over{border-color:var(--lely-red);background:rgba(200,16,46,.06);}
  button.primary{background:linear-gradient(145deg,var(--lely-red),var(--lely-red-dark));color:#fff;border:none;border-radius:10px;padding:13px 22px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(226,0,26,.35);}
  button.secondary{background:var(--card);color:var(--ink);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:.85rem;font-weight:600;cursor:pointer;}
  .err{margin-top:12px;color:var(--less);font-size:.88rem;font-weight:600;}
  .last{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .last b{display:block;margin-bottom:8px;font-size:.9rem;}

  /* summary + filters */
  .progress{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;font-weight:700;margin-bottom:8px;gap:8px;}
  .progress-top span{font-weight:600;color:var(--muted);font-size:.78rem;}
  .bar{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;display:flex;}
  .bar i{display:block;height:100%;}
  .bar .b-ok{background:var(--ok);} .bar .b-less{background:var(--less);} .bar .b-more{background:var(--more);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{flex:1 0 auto;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:8px 10px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap;}
  .chip.active{border-color:var(--lely-red);box-shadow:0 0 0 2px rgba(200,16,46,.15);}
  .chip .n{margin-left:4px;font-weight:800;}
  .chip.ok{color:var(--ok);} .chip.less{color:var(--less);} .chip.more{color:var(--more);}
  .search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;margin-top:10px;}
  .search-box input{border:none;outline:none;font-size:1rem;flex:1;background:transparent;color:var(--ink);min-width:0;}
  .search-box svg{flex:0 0 auto;opacity:.5;}
  .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}

  /* groups + rows */
  main{margin-top:12px;}
  details.group{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  details.group[open]{box-shadow:0 4px 16px rgba(0,0,0,.10);border-color:var(--lely-red);}
  details.group summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:.92rem;background:var(--surface2);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  details.group summary::-webkit-details-marker{display:none;}
  .count{font-size:.72rem;font-weight:600;color:var(--muted);background:var(--card);border-radius:20px;padding:2px 9px;white-space:nowrap;}
  .gstate{display:inline-flex;gap:4px;}
  .gstate i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .chev{transition:transform .15s ease;font-size:.8rem;color:var(--muted);}
  details.group[open] .chev{transform:rotate(90deg);}
  .item-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--border);border-left:5px solid transparent;transition:background .15s,border-color .15s;}
  .item-row.st-ok{background:var(--ok-bg);border-left-color:var(--ok);}
  .item-row.st-less{background:var(--less-bg);border-left-color:var(--less);}
  .item-row.st-more{background:var(--more-bg);border-left-color:var(--more);}
  .item-thumb{width:48px;height:48px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;}
  .item-thumb img{width:100%;height:100%;object-fit:cover;}
  .item-thumb.empty{cursor:default;color:var(--muted);}
  .item-thumb.empty svg{width:22px;height:22px;opacity:.5;}
  .item-main{flex:1 1 0;min-width:0;}
  .item-artikel{font-size:.72rem;color:var(--muted);font-family:'Consolas',monospace;}
  .item-bez{font-size:.92rem;font-weight:600;line-height:1.25;}
  .item-note{font-size:.72rem;color:var(--more);margin-top:2px;font-weight:600;}
  .svc{display:inline-block;margin-top:4px;font-size:.72rem;font-weight:700;color:var(--more);background:rgba(255,160,0,.13);border:1px solid rgba(255,160,0,.45);border-radius:20px;padding:2px 9px;}
  .entry{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .soll{text-align:right;min-width:54px;border:none;background:transparent;cursor:pointer;color:var(--ink);padding:2px 4px;border-radius:8px;}
  .soll:active{background:var(--surface2);}
  .soll small{display:block;font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .soll b{font-size:1.15rem;line-height:1.1;}
  .soll span{display:block;font-size:.68rem;color:var(--muted);}
  .ist{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .ist input{width:72px;padding:9px 6px;border:1.5px solid var(--border);border-radius:8px;text-align:center;font-size:1rem;font-weight:700;background:var(--card);color:var(--ink);}
  .st-ok .ist input{border-color:var(--ok);} .st-less .ist input{border-color:var(--less);} .st-more .ist input{border-color:var(--more);}
  .diff{font-size:.72rem;font-weight:800;min-height:1em;}
  .st-ok .diff{color:var(--ok);} .st-less .diff{color:var(--less);} .st-more .diff{color:var(--more);}
  .note{display:none;flex:1 1 100%;margin-left:60px;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;background:var(--card);color:var(--ink);font-family:inherit;min-width:0;}
  .st-less .note,.st-more .note{display:block;}
  .export{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .export b{display:block;font-size:.9rem;margin-bottom:4px;}
  .export p{margin:0 0 10px;font-size:.78rem;color:var(--muted);line-height:1.4;}
  .export .btns{display:flex;gap:8px;flex-wrap:wrap;}
  .export .btns button{flex:1 1 150px;}
  .empty-msg{padding:24px;text-align:center;color:var(--muted);font-size:.9rem;}
  .lightbox{position:fixed;inset:0;background:rgba(20,18,16,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lightbox-inner{position:relative;background:#fff;border-radius:12px;padding:16px;max-width:min(90vw,560px);max-height:90vh;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lightbox-inner img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:6px;}
  .lightbox-caption{font-size:.9rem;font-weight:600;text-align:center;color:#1c1c1c;}
  .lightbox-close{position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;background:var(--lely-red);color:#fff;border:2px solid #fff;font-size:1.3rem;line-height:1;cursor:pointer;}
  .foot{margin:22px 0 0;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.5;}
  @media (max-width:600px){
    .item-row{flex-wrap:wrap;row-gap:8px;}
    .entry{flex:1 1 100%;margin-left:60px;justify-content:space-between;}
    .soll{text-align:left;}
    .chip{flex:1 1 calc(33.333% - 6px);padding:9px 6px;}
    .chip:nth-child(n+4){flex-basis:calc(50% - 6px);}
  }



  .rng{display:flex;gap:6px;margin-top:14px;}
  .rng button{flex:1;}
  .rng button.active{border-color:var(--lely-red);box-shadow:0 0 0 2px rgba(200,16,46,.15);}
  .sec{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .sec h3{margin:0 0 8px;font-size:.95rem;}
  .sec small{display:block;color:var(--muted);font-size:.74rem;margin:-4px 0 8px;line-height:1.4;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .kpi{background:var(--surface2);border-radius:10px;padding:10px 12px;}
  .kpi b{display:block;font-size:1.4rem;line-height:1.1;}
  .kpi span{font-size:.72rem;color:var(--muted);font-weight:600;}
  .row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:.85rem;}
  .row .lab{flex:0 0 38%;min-width:0;overflow-wrap:anywhere;}
  .row .bar2{flex:1;background:var(--surface2);border-radius:6px;height:18px;overflow:hidden;position:relative;}
  .row .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--lely-red),var(--lely-red-dark));border-radius:6px;}
  .row .num{flex:0 0 auto;min-width:64px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
  .row .num em{font-style:normal;font-weight:500;color:var(--muted);font-size:.74rem;}
  .stack{display:flex;height:16px;border-radius:6px;overflow:hidden;flex:1;background:var(--surface2);}
  .stack i{display:block;height:100%;}
  .leg{font-size:.7rem;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
  .leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  .days{display:flex;align-items:flex-end;gap:2px;height:60px;}
  .days i{flex:1;background:var(--lely-red);border-radius:2px 2px 0 0;min-height:1px;opacity:.85;}
  .none{color:var(--muted);font-size:.85rem;padding:6px 0;}
  .err{margin-top:12px;color:var(--less);font-weight:600;}
/* ===== Lely KDW – gemeinsames "Liquid Glass"-Design (ruhig, erwachsen): gilt für Menü, KDW, Auto, Bestand, Statistik =====
   Quelle: Lely-Bestand/glass.css – wird vom Generator in alle Seiten eingebettet (nicht in den Seiten direkt ändern). */

/* --- Farben/Flächen je Design (hell / dunkel / System) --- */
:root[data-theme]{
  --g-bg:#eceff3;
  --g-orbs:radial-gradient(520px 380px at 6% 0%, rgba(200,16,46,.10), transparent 70%),
           radial-gradient(560px 420px at 100% 38%, rgba(70,110,200,.09), transparent 70%),
           radial-gradient(480px 360px at 20% 100%, rgba(255,150,70,.07), transparent 70%);
  --g-surf:rgba(255,255,255,.66);
  --g-surf-strong:rgba(255,255,255,.88);
  --g-brd:rgba(255,255,255,.78);
  --g-line:rgba(15,23,42,.09);
  --g-input:rgba(255,255,255,.80);
  --g-sh:0 1px 2px rgba(15,23,42,.05), 0 12px 30px rgba(15,23,42,.07);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.9);
  --g-ink-soft:#4d5663;
  --g-tint:rgba(200,16,46,.09);
  --g-tint-brd:rgba(200,16,46,.18);
  --g-tint-ink:#b50e29;
  --g-slate:rgba(71,85,105,.12);
  --g-slate-brd:rgba(71,85,105,.22);
  --g-slate-ink:#3c4756;
}
:root[data-theme="dark"]{
  --g-bg:#0b0d11;
  --g-orbs:radial-gradient(520px 380px at 6% 0%, rgba(200,16,46,.20), transparent 70%),
           radial-gradient(560px 420px at 100% 38%, rgba(70,110,220,.15), transparent 70%),
           radial-gradient(480px 360px at 20% 100%, rgba(255,140,60,.08), transparent 70%);
  --g-surf:rgba(27,30,37,.60);
  --g-surf-strong:rgba(30,33,41,.88);
  --g-brd:rgba(255,255,255,.09);
  --g-line:rgba(255,255,255,.08);
  --g-input:rgba(255,255,255,.055);
  --g-sh:0 12px 32px rgba(0,0,0,.38);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.06);
  --g-ink-soft:#a5adb9;
  --g-tint:rgba(255,90,112,.13);
  --g-tint-brd:rgba(255,90,112,.26);
  --g-tint-ink:#ff8798;
  --g-slate:rgba(148,163,184,.13);
  --g-slate-brd:rgba(148,163,184,.26);
  --g-slate-ink:#b6c0cf;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --g-bg:#0b0d11;
    --g-orbs:radial-gradient(520px 380px at 6% 0%, rgba(200,16,46,.20), transparent 70%),
             radial-gradient(560px 420px at 100% 38%, rgba(70,110,220,.15), transparent 70%),
             radial-gradient(480px 360px at 20% 100%, rgba(255,140,60,.08), transparent 70%);
    --g-surf:rgba(27,30,37,.60); --g-surf-strong:rgba(30,33,41,.88); --g-brd:rgba(255,255,255,.09); --g-line:rgba(255,255,255,.08);
    --g-input:rgba(255,255,255,.055); --g-sh:0 12px 32px rgba(0,0,0,.38); --g-hi:inset 0 1px 0 rgba(255,255,255,.06); --g-ink-soft:#a5adb9;
    --g-tint:rgba(255,90,112,.13); --g-tint-brd:rgba(255,90,112,.26); --g-tint-ink:#ff8798;
    --g-slate:rgba(148,163,184,.13); --g-slate-brd:rgba(148,163,184,.26); --g-slate-ink:#b6c0cf;
  }
}

/* --- Schrift (Einstellung "Schrift" im Menü: Lely = Noto Sans + Ubuntu, System = Segoe UI/Arial) --- */
:root{--sans:'Segoe UI', Arial, Helvetica, sans-serif;--font-head:var(--sans);}
:root[data-font="lely"]{--sans:'Noto Sans','Segoe UI',Arial,Helvetica,sans-serif;--font-head:'Ubuntu','Noto Sans','Segoe UI',Arial,Helvetica,sans-serif;}
:root[data-theme] body{font-family:var(--sans);}
:root[data-theme] .topbar-title, :root[data-theme] .modal-box h3, :root[data-theme] .set-box h3.t, :root[data-theme] .start h2, :root[data-theme] .hello-t, :root[data-theme] .tile-title{font-family:var(--font-head);font-weight:500;font-synthesis:none;}

/* --- Hintergrund --- */
:root[data-theme] body{background:var(--g-orbs), var(--g-bg);background-attachment:fixed;}

/* --- Kopfzeile: ruhiges Rot, feine Lichtkante --- */
:root[data-theme] header.topbar{
  background:linear-gradient(180deg,var(--lely-red),var(--lely-red-dark));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20), 0 8px 26px rgba(120,10,30,.20);
  border-bottom:1px solid rgba(255,255,255,.10);
}
:root[data-theme] header.topbar::after{display:none;}
.topbar-menu, .topbar-settings, .topbar-gear, .topbar-btn{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 11px;border-radius:11px;
  border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:.78rem;font-weight:700;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28);font-family:inherit;align-self:center;
}
.topbar-settings, .topbar-gear{width:36px;padding:0;}
.topbar-menu:active, .topbar-settings:active, .topbar-gear:active{background:rgba(255,255,255,.28);}
.topbar-menu .ic{margin-right:0;}
.topbar-actions{display:flex;gap:8px;flex:0 0 auto;align-items:center;margin-left:auto;}

/* --- Flächen (Karten) --- */
:root[data-theme] .meta-card, :root[data-theme] .search-box, :root[data-theme] details.group, :root[data-theme] .kunde-card,
:root[data-theme] .start, :root[data-theme] .progress, :root[data-theme] .export, :root[data-theme] .card, :root[data-theme] .sec,
:root[data-theme] .cart-preview{
  background:var(--g-surf);border:1px solid var(--g-brd);border-radius:16px;box-shadow:var(--g-sh), var(--g-hi);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
}
:root[data-theme] details.group{overflow:hidden;}
:root[data-theme] details.group[open]{border-color:var(--g-tint-brd);box-shadow:var(--g-sh), var(--g-hi), 0 0 0 1px var(--g-tint);}
:root[data-theme] details.group:hover{box-shadow:var(--g-sh), var(--g-hi);}
:root[data-theme] details.group summary{background:transparent;}
:root[data-theme] details.group summary .count{background:var(--g-input);border:1px solid var(--g-line);}
:root[data-theme] .item-row{border-top-color:var(--g-line);}
:root[data-theme] .item-thumb{background:var(--g-input);border:1px solid var(--g-line);}
:root[data-theme] .sec{padding:14px 16px;}
:root[data-theme] .search-box{border-radius:14px;}

/* --- Eingabefelder --- */
:root[data-theme] .field input, :root[data-theme] .field select, :root[data-theme] .settings-select, :root[data-theme] .extra-text,
:root[data-theme] .item-qty-wrap input, :root[data-theme] .ist input, :root[data-theme] .note, :root[data-theme] .field .ro{
  background:var(--g-input);border:1px solid var(--g-line);border-radius:10px;box-shadow:inset 0 1px 2px rgba(15,23,42,.04);
}
:root[data-theme] .field.readonly input{background:transparent;}
:root[data-theme] .search-box input{background:transparent;box-shadow:none;border:none;}
:root[data-theme] input:focus, :root[data-theme] select:focus, :root[data-theme] textarea:focus{outline:none;border-color:var(--lely-red);box-shadow:0 0 0 3px rgba(200,16,46,.14);}
:root[data-theme] .search-box input:focus{box-shadow:none;}

/* --- Schaltflächen --- */
:root[data-theme] button.primary, :root[data-theme] .modal-choice-btn.modal-primary, :root[data-theme] .mbtn.primary{
  background:linear-gradient(180deg,var(--lely-red),var(--lely-red-dark));color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 6px 16px rgba(150,12,36,.24);
}
:root[data-theme] button.primary:hover{filter:brightness(1.05);}
:root[data-theme] button.secondary, :root[data-theme] .modal-choice-btn, :root[data-theme] .mbtn, :root[data-theme] .cart-count,
:root[data-theme] .kunde-card .kc-edit, :root[data-theme] .chip-center, :root[data-theme] .btn-copy-link, :root[data-theme] .tab-btn, :root[data-theme] .chip, :root[data-theme] .rcpt button{
  background:var(--g-surf);border:1px solid var(--g-brd);border-radius:12px;color:var(--ink);box-shadow:var(--g-hi), 0 1px 2px rgba(15,23,42,.05);
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
}
:root[data-theme] .modal-choice-btn.modal-primary, :root[data-theme] .mbtn.primary, :root[data-theme] .tab-btn.active{color:#fff;}
:root[data-theme] .tab-btn.active{background:linear-gradient(180deg,var(--lely-red),var(--lely-red-dark));border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 6px 16px rgba(150,12,36,.22);}
:root[data-theme] .chip.active{border-color:var(--lely-red);box-shadow:var(--g-hi), 0 0 0 2px rgba(200,16,46,.14);}
:root[data-theme] .cart-count.has-items{border-color:var(--g-tint-brd);background:var(--g-tint);color:var(--g-tint-ink);}
:root[data-theme] .theme-seg, :root[data-theme] .seg{background:var(--g-input);border:1px solid var(--g-line);border-radius:12px;}
:root[data-theme] .theme-btn.active, :root[data-theme] .font-btn.active, :root[data-theme] .seg button.active{background:var(--g-surf-strong);border:1px solid var(--g-brd);box-shadow:var(--g-hi), 0 1px 3px rgba(15,23,42,.12);}

/* --- Dialoge --- */
:root[data-theme] .modal-overlay, :root[data-theme] .set-ov, :root[data-theme] .kw-ov{background:rgba(12,14,20,.36);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
:root[data-theme] .modal-box, :root[data-theme] .set-box, :root[data-theme] .kw-box{
  background:var(--g-surf-strong);border:1px solid var(--g-brd);border-radius:22px;
  box-shadow:0 28px 70px rgba(10,12,20,.30), var(--g-hi);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
}
:root[data-theme] .modal-box .sec, :root[data-theme] .set-box .sec{background:var(--g-input);box-shadow:none;border-color:var(--g-line);-webkit-backdrop-filter:none;backdrop-filter:none;}
:root[data-theme] .kw-btn{background:var(--g-input);border-color:var(--g-line);border-radius:12px;}
:root[data-theme] .warnbox{border-radius:12px;}

/* --- Fußleisten --- */
:root[data-theme] footer.bar, :root[data-theme] .sendbar{
  background:var(--g-surf-strong);border-top:1px solid var(--g-brd);box-shadow:0 -10px 30px rgba(15,23,42,.08), var(--g-hi);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
}

/* --- Menü-Startseite: ruhige, getönte Icon-Felder statt glänzender Kacheln --- */
:root[data-theme] a.tile{background:var(--g-surf);border:1px solid var(--g-brd);box-shadow:var(--g-sh), var(--g-hi);border-radius:18px;
  -webkit-backdrop-filter:blur(22px) saturate(165%);backdrop-filter:blur(22px) saturate(165%);color:var(--ink);}
:root[data-theme] a.tile:hover{border-color:var(--g-tint-brd);}
:root[data-theme] .tile-ico{width:50px;height:50px;border-radius:15px;background:var(--g-tint);box-shadow:inset 0 0 0 1px var(--g-tint-brd);border:none;}
:root[data-theme] .tile-ico::before{display:none;}
:root[data-theme] .tile-ico svg{width:25px;height:25px;stroke:var(--g-tint-ink);stroke-width:1.7;filter:none;}
:root[data-theme] .tile.t-auto .tile-ico{background:var(--g-slate);box-shadow:inset 0 0 0 1px var(--g-slate-brd);}
:root[data-theme] .tile.t-auto .tile-ico svg{stroke:var(--g-slate-ink);}
:root[data-theme] .tile-go svg{stroke:var(--g-ink-soft);}
:root[data-theme] .chip-center{border-radius:999px;}

/* --- Kopfzeile: Titel links, Menü + Zahnrad rechts – immer in einer Zeile --- */
:root[data-theme] .topbar-row1{flex-wrap:nowrap;gap:12px;align-items:center;}
:root[data-theme] .topbar-left{flex:1 1 auto;min-width:0;}
:root[data-theme] .topbar-title{white-space:normal;line-height:1.15;}
:root[data-theme] .topbar-sub{white-space:normal;line-height:1.25;font-size:.68rem;letter-spacing:.02em;}

/* --- Filter-Chips behalten ihre Statusfarben --- */
:root[data-theme] .chip.ok{color:var(--ok);}
:root[data-theme] .chip.less{color:var(--less);}
:root[data-theme] .chip.more{color:var(--more);}

/* --- Segment-Schalter (Design / Schrift / Dateiformat) --- */
.seg{display:flex;gap:4px;padding:4px;margin:6px 0 2px;}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;background:none;padding:9px 6px;border-radius:9px;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer;font-family:inherit;}
.seg button.active{color:var(--ink);}
.seg .ic{margin-right:0;}

/* --- Menü-Fenster (assets/menu.js): auf jeder Seite über dem Inhalt --- */
.mn-ov{position:fixed;inset:0;z-index:9000;display:none;align-items:flex-start;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px 12px;background:rgba(12,14,20,.36);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
.mn-ov.mn-show{display:flex;}
.mn-box{width:100%;max-width:460px;max-height:calc(100dvh - 24px);overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 18px;border-radius:22px;color:var(--ink);
  background:var(--g-surf-strong,rgba(255,255,255,.9));border:1px solid var(--g-brd,rgba(255,255,255,.8));box-shadow:0 28px 70px rgba(10,12,20,.30), var(--g-hi,none);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);animation:mn-in .18s ease;}
@keyframes mn-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.mn-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.mn-head h3{margin:0;font-size:1.15rem;font-family:var(--font-head,inherit);}
.mn-x{width:36px;height:36px;border-radius:10px;border:1px solid var(--g-line,rgba(0,0,0,.1));background:var(--g-input,#fff);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.mn-box .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
.mn-nav{display:flex;flex-direction:column;gap:8px;}
.mn-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;text-decoration:none;color:var(--ink);font-family:inherit;font-size:.95rem;cursor:pointer;
  padding:11px 12px;border-radius:14px;background:var(--g-input,#fff);border:1px solid var(--g-line,rgba(0,0,0,.1));}
.mn-item > span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.mn-item b{font-weight:700;}
.mn-item small{color:var(--muted);font-size:.74rem;}
.mn-item > .ic:first-child{color:var(--g-tint-ink,var(--lely-red));}
.mn-item > .ic:last-child{color:var(--muted);width:18px;height:18px;}
.mn-item:active{filter:brightness(.96);}
.mn-active{border-color:var(--g-tint-brd,rgba(200,16,46,.2));background:var(--g-tint,rgba(200,16,46,.08));}
.mn-sec{margin-top:14px;padding:12px;border-radius:14px;background:var(--g-input,#fff);border:1px solid var(--g-line,rgba(0,0,0,.1));}
.mn-sec h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.mn-sec p{margin:0 0 8px;font-size:.82rem;color:var(--g-ink-soft,var(--muted));line-height:1.35;}
.mn-who{font-weight:700;margin-bottom:8px;}
.mn-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 12px;border-radius:12px;cursor:pointer;text-decoration:none;font-family:inherit;font-weight:700;font-size:.88rem;color:var(--ink);
  background:var(--g-surf-strong,#fff);border:1px solid var(--g-line,rgba(0,0,0,.12));box-shadow:var(--g-hi,none);}
.mn-btn:active{filter:brightness(.95);}
.mn-row{display:flex;gap:8px;margin-top:8px;}
.mn-row .mn-btn{flex:1;font-size:.8rem;padding:9px 6px;}
.mn-list{font-size:.8rem;line-height:1.5;color:var(--g-ink-soft,var(--muted));}
.mn-muted{color:var(--muted);}
.mn-msg{margin-top:8px;font-size:.8rem;font-weight:700;}
.mn-msg.ok{color:var(--ok);} .mn-msg.err{color:var(--less);}
.mn-link{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font-family:inherit;font-size:.85rem;cursor:pointer;padding:6px 10px;}
.mn-ol{margin:0;padding-left:20px;font-size:.85rem;line-height:1.5;}
.mn-seg{display:flex;gap:4px;padding:4px;margin:2px 0;background:var(--g-surf-strong,#fff);border:1px solid var(--g-line,rgba(0,0,0,.1));border-radius:12px;}
.mn-seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;background:none;padding:9px 6px;border-radius:9px;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer;font-family:inherit;}
.mn-seg button.active{color:var(--ink);background:var(--g-input,#fff);border-color:var(--g-brd);box-shadow:var(--g-hi), 0 1px 3px rgba(15,23,42,.12);}

</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-orb sp-o1"></div><div class="sp-orb sp-o2"></div>
  <div class="sp-card">
    <svg class="sp-logo" viewBox="0 0 220 140" aria-hidden="true">
      <rect class="sp-box" x="0" y="0" width="220" height="140" rx="14"/>
      <ellipse class="sp-ring" cx="110" cy="70" rx="93" ry="50"/>
      <g transform="translate(110,70) skewX(-10) translate(-110,-70)"><text class="sp-word" x="110" y="88">LELY</text></g>
    </svg>
  </div>
  <div class="sp-kitt" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i></div>
</div>

<header class="topbar">
  <div class="topbar-row1">
    <div class="topbar-left">
      <div class="topbar-title">Statistika používání</div>
      <div class="topbar-sub" id="sub">Anonymní · jen počítadla</div>
    </div>
    <div class="topbar-actions"><a class="topbar-menu" href="../"><svg class="ic ic-solo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Menü</a></div>
  </div>
</header>
<div class="wrap">
  <div class="rng" id="rng">
    <button type="button" class="secondary" data-d="7">7 dní</button>
    <button type="button" class="secondary active" data-d="30">30 dní</button>
    <button type="button" class="secondary" data-d="90">90 dní</button>
  </div>
  <div class="err hidden" id="err"></div>
  <div id="out"></div>
  <div class="foot">Ukládají se jen počítadla (stránka, krok postupu, doba, zařízení, centrum). Žádná jména, údaje o zákaznících ani objednávkách, žádná hledaná slova ani identifikátory. Čísla jsou přibližná. Vyřazení tohoto zařízení: otevřít stránku s <b>?nostats=1</b>.</div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const PAGE_NAMES = { menu: 'Menu', kdw: 'Einbau + Verbrauchsmaterial (objednávka do skladu)', kunde: 'Material für Kunden (pro zákazníka)', auto: 'Aus dem Auto abbuchen (odpis z auta)', bestand: 'Bestand zählen (počítání zásob)', start: 'Přímý vstup' };
const BUCKETS = ['<10s', '10-30s', '30-60s', '1-3m', '3-10m', '>10m'];
const BCOL = ['#bfe3c0', '#8fd194', '#ffd98a', '#ffb44d', '#ef7a6a', '#c8102E'];
const BLAB = { '<10s': 'pod 10 s', '10-30s': '10–30 s', '30-60s': '30–60 s', '1-3m': '1–3 min', '3-10m': '3–10 min', '>10m': 'přes 10 min' };

function merge(days){
  const t = { n: 0, pv: {}, tr: {}, ev: {}, dev: {}, ctr: {}, dur: {}, evdur: {} }, perDay = {};
  Object.keys(days).sort().forEach(d => {
    const a = days[d]; t.n += a.n || 0; perDay[d] = a.n || 0;
    ['pv', 'tr', 'ev', 'dev', 'ctr', 'dur', 'evdur'].forEach(k => Object.keys(a[k] || {}).forEach(x => { t[k][x] = (t[k][x] || 0) + a[k][x]; }));
  });
  return { t, perDay };
}
const n0 = v => v || 0;
const pct = (a, b) => b ? Math.round(a * 100 / b) + ' %' : '–';
function bars(items, total){   // [[label, value]]
  const max = Math.max(1, ...items.map(i => i[1]));
  return items.length ? items.map(([l, v]) => '<div class="row"><div class="lab">' + esc(l) + '</div><div class="bar2"><i style="width:' + (v * 100 / max) + '%"></i></div><div class="num">' + v + (total ? ' <em>' + pct(v, total) + '</em>' : '') + '</div></div>').join('') : '<div class="none">Zatím žádná data.</div>';
}
function funnel(title, steps, extra){   // steps: [[label, value]], erster Schritt = 100 %
  const first = steps[0][1];
  return '<div class="sec"><h3>' + esc(title) + '</h3>' + bars(steps.map(s => [s[0], s[1]]), first || 0) + (extra ? '<small style="margin-top:8px">' + extra + '</small>' : '') + '</div>';
}
function durRow(label, get){   // get(bucket) -> Anzahl
  const vals = BUCKETS.map(get), tot = vals.reduce((a, b) => a + b, 0);
  if (!tot) return '';
  return '<div class="row"><div class="lab">' + esc(label) + '</div><div class="stack">' + vals.map((v, i) => v ? '<i style="width:' + (v * 100 / tot) + '%;background:' + BCOL[i] + '" title="' + BLAB[BUCKETS[i]] + ': ' + v + '"></i>' : '').join('') + '</div><div class="num">' + tot + '</div></div>';
}
const legend = '<div class="leg">' + BUCKETS.map((b, i) => '<span><i style="background:' + BCOL[i] + '"></i>' + BLAB[b] + '</span>').join('') + '</div>';

function render(days, nd){
  const { t, perDay } = merge(days), ev = k => n0(t.ev[k]);
  if (!t.n){ $('out').innerHTML = '<div class="sec"><div class="none">Ve zvoleném období zatím nejsou žádná data.</div></div>'; return; }
  const pvTotal = Object.values(t.pv).reduce((a, b) => a + b, 0), activeDays = Object.values(perDay).filter(v => v > 0).length;
  let h = '<div class="sec"><div class="kpis">' +
    '<div class="kpi"><b>' + pvTotal + '</b><span>Zobrazení stránek</span></div>' +
    '<div class="kpi"><b>' + activeDays + '</b><span>Dny s používáním</span></div>' +
    '<div class="kpi"><b>' + pct(n0(t.dev.mobile), n0(t.dev.mobile) + n0(t.dev.desktop)) + '</b><span>Mobil</span></div>' +
    '<div class="kpi"><b>' + ev('search.miss') + '</b><span>Hledání bez výsledku</span></div></div></div>';
  // Tage
  const dayKeys = Object.keys(perDay).sort(), maxD = Math.max(1, ...Object.values(perDay));
  h += '<div class="sec"><h3>Používání po dnech</h3><div class="days">' + dayKeys.map(k => '<i style="height:' + (perDay[k] * 100 / maxD) + '%" title="' + k + ': ' + perDay[k] + ' událostí"></i>').join('') + '</div></div>';
  // Seiten
  h += '<div class="sec"><h3>Nejnavštěvovanější stránky</h3>' + bars(Object.keys(t.pv).map(k => [PAGE_NAMES[k] || k, t.pv[k]]).sort((a, b) => b[1] - a[1]), pvTotal) + '</div>';
  // Wege
  h += '<div class="sec"><h3>Cesty mezi stránkami</h3><small>Odkud kam se přechází („Přímý vstup“ = první stránka návštěvy).</small>' +
    bars(Object.keys(t.tr).map(k => { const [f, to] = k.split('>'); return [(PAGE_NAMES[f] || f) + ' → ' + (PAGE_NAMES[to] || to), t.tr[k]]; }).sort((a, b) => b[1] - a[1]).slice(0, 12)) + '</div>';
  // Abläufe
  const sentK = ev('kdw.sent_center') + ev('kdw.sent_home');
  h += funnel('Postup: Einbau + Verbrauchsmaterial', [['Stránka otevřena', n0(t.pv.kdw)], ['Vybráno zboží', ev('kdw.cart')], ['Kliknuto na „Senden“', ev('kdw.send_click')], ['E-mail otevřen', sentK]],
    'Dodání: centrum ' + ev('kdw.sent_center') + ' · domácí adresa ' + ev('kdw.sent_home'));
  const sentC = ev('kunde.sent_express') + ev('kunde.sent_kunde') + ev('kunde.sent_abholung');
  h += funnel('Postup: Material für Kunden', [['Stránka otevřena', n0(t.pv.kunde)], ['Údaje o zákazníkovi potvrzeny', ev('kunde.dialog_ok')], ['Vybráno zboží', ev('kunde.cart')], ['Kliknuto na „Senden“', ev('kunde.send_click')], ['E-mail otevřen', sentC]],
    'Doprava: Express ' + ev('kunde.sent_express') + ' · dodání zákazníkovi ' + ev('kunde.sent_kunde') + ' · vyzvednutí ' + ev('kunde.sent_abholung') +
    '<br>Vyplněné nezařazené položky: ' + ev('kunde.extra_used') + ' · druhý e-mail otevřen: ' + ev('kunde.extra_mail') +
    '<br>Materialliste PDF: ' + ev('kunde.pdf_ok') + ' přečteno / ' + ev('kunde.pdf_fail') + ' selhalo · foto: ' + ev('kunde.foto_ok') + ' / ' + ev('kunde.foto_fail'));
  const booked = ev('auto.booked.xlsx') + ev('auto.booked.pdf');
  h += funnel('Postup: Aus dem Auto abbuchen', [['Stránka otevřena', n0(t.pv.auto)], ['Vybráno zboží', ev('auto.cart')], ['Otevřeno „Abbuchen“', ev('auto.finish_open')], ['Odepsáno', booked]],
    'Formát: Excel ' + ev('auto.booked.xlsx') + ' · PDF ' + ev('auto.booked.pdf') + ' · sdílení ' + ev('auto.share_shared') + ' (zrušeno ' + ev('auto.share_cancelled') + ') · stažení ' + (ev('auto.download') + ev('auto.share_unsupported')) +
    '<br>Otevřeno bez stavu auta: ' + ev('auto.nostock') + ' · Materialliste PDF: ' + ev('auto.pdf_ok') + ' / ' + ev('auto.pdf_fail') + ' · foto: ' + ev('auto.foto_ok') + ' / ' + ev('auto.foto_fail'));
  h += funnel('Postup: Bestand zählen', [['Stránka otevřena', n0(t.pv.bestand)], ['Seznam načten', ev('bestand.list_loaded')], ['Exportováno do Excelu', ev('bestand.export')], ['Převzato jako stav auta', ev('bestand.stock_commit')]],
    'Seznam nečitelný: ' + ev('bestand.list_error') + ' · Menu: záloha uložena ' + ev('menu.backup_export') + ', obnovena ' + ev('menu.backup_restore'));
  // Dauer
  const durPages = Object.keys(t.pv).map(p => durRow(PAGE_NAMES[p] || p, b => n0(t.dur[p + '|' + b]))).join('');
  h += '<div class="sec"><h3>Doba na stránce</h3><small>Jak dlouho byla stránka viditelná, než se odešlo nebo aplikace přešla do pozadí.</small>' + (durPages || '<div class="none">Zatím žádná data.</div>') + (durPages ? legend : '') + '</div>';
  const DONE = [['kdw.sent_center', 'Einbau + Verbrauch. → centrum'], ['kdw.sent_home', 'Einbau + Verbrauch. → domů'], ['kunde.sent_express', 'Zákazník → Express'], ['kunde.sent_kunde', 'Zákazník → zákazníkovi'], ['kunde.sent_abholung', 'Zákazník → vyzvednutí'], ['auto.booked.xlsx', 'Auto → Excel'], ['auto.booked.pdf', 'Auto → PDF'], ['bestand.export', 'Bestand → export']];
  const durDone = DONE.map(([k, l]) => durRow(l, b => n0(t.evdur[k + '|' + b]))).join('');
  h += '<div class="sec"><h3>Doba do dokončení</h3><small>Čas od otevření stránky do odeslání – čím delší, tím složitější cesta.</small>' + (durDone || '<div class="none">Zatím žádná data.</div>') + (durDone ? legend : '') + '</div>';
  // Geräte / Center
  h += '<div class="sec"><h3>Zařízení a centra</h3>' + bars([['Mobil', n0(t.dev.mobile)], ['Počítač', n0(t.dev.desktop)]], n0(t.dev.mobile) + n0(t.dev.desktop)) + '<div style="height:8px"></div>' +
    bars(Object.keys(t.ctr).map(k => [k, t.ctr[k]]).sort((a, b) => b[1] - a[1]), Object.values(t.ctr).reduce((a, b) => a + b, 0)) + '</div>';
  $('out').innerHTML = h;
  $('sub').textContent = 'Posledních ' + nd + ' dní · anonymní · jen počítadla';
}
let days = 30;
async function load(){
  $('err').classList.add('hidden');
  try {
    const r = await fetch('/api/stats?days=' + days, { cache: 'no-store' });
    if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) throw new Error('kein Server');
    render((await r.json()).days || {}, days);
  } catch(e){ $('out').innerHTML = ''; $('err').textContent = 'Statistiku se nepodařilo načíst (funguje jen na ostré stránce).'; $('err').classList.remove('hidden'); }
}
$('rng').addEventListener('click', e => {
  const b = e.target.closest('button[data-d]'); if (!b) return;
  days = parseInt(b.dataset.d, 10); document.querySelectorAll('#rng button').forEach(x => x.classList.toggle('active', x === b)); load();
});
load();
</script>
<script src="/assets/data.js"></script>
<script src="/assets/menu.js"></script>
</body>
</html>
